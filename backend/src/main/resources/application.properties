# Configuracion por defecto del backend. Cada clave se puede sobrescribir con una propiedad
# del sistema (-Dpresencia.http.port=9090) o con una variable de entorno en mayusculas con
# '_' en lugar de '.' y '-' (PRESENCIA_HTTP_PORT=9090).

# Interfaz y puerto HTTP. 'localhost' evita exponer la API fuera del equipo.
presencia.http.host=localhost
presencia.http.port=8080

# Origen permitido por CORS para los frontends (servidos en otro puerto).
presencia.cors.allowed-origin=*

# Base de datos H2 en fichero, relativa al directorio de trabajo (se crea ./data/).
# Es una base de datos local de desarrollo sin datos sensibles; en un despliegue real la
# clave se configuraria con PRESENCIA_DB_PASSWORD y nunca en el repositorio.
presencia.db.url=jdbc:h2:file:./data/presencia;DB_CLOSE_DELAY=-1
presencia.db.user=sa
presencia.db.password=

# Zona horaria en la que se interpretan los horarios.
presencia.zone=Atlantic/Canary

# Carga datos ficticios de ejemplo si la base de datos esta vacia.
presencia.seed=true

# Duracion de una sesion iniciada (minutos) e iteraciones de PBKDF2 al proteger las claves.
presencia.security.session-minutes=720
presencia.security.pbkdf2-iterations=210000
